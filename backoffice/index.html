<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 삼국지 — 뉴스레터 구독</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .preview-section {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px;
      margin-top: 20px;
      background: var(--surface2);
    }
    .preview-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }
    .preview-item:last-child { border-bottom: none; }
    .preview-icon { font-size: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="badge">Daily Sangukji Newsletter</div>
    <h1>📜 데일리 삼국지</h1>
    <p class="tagline">매일 아침 7시, 삼국지의 인물·에피소드·고사성어를<br>이메일로 받아보세요</p>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-title">구독 신청</div>
      <form id="subscribeForm">
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <input type="hidden" id="refCode" name="ref" value="">
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">✉️ 무료 구독하기</span>
          <span id="btnSpinner" class="spinner" style="display:none;"></span>
        </button>
      </form>
      <div id="msg" class="msg"></div>
      <div id="inviteBox" class="invite-box" style="display:none;">
        <div class="invite-label">🎎 아래 링크로 친구를 초대해보세요</div>
        <div class="invite-url" id="inviteUrl"></div>
        <button class="copy-btn" onclick="copyInvite()">링크 복사</button>
      </div>
    </div>

    <div class="preview-section">
      <div class="card-title" style="margin-bottom:12px;">매일 이런 내용을 보내드려요</div>
      <div class="preview-item">
        <span class="preview-icon">⚔️</span>
        <div><b style="color:var(--text);">오늘의 에피소드</b> — 적벽대전, 도원결의 등 삼국지의 명장면을 정사와 연의로 비교</div>
      </div>
      <div class="preview-item">
        <span class="preview-icon">👤</span>
        <div><b style="color:var(--text);">오늘의 인물</b> — 제갈량, 조조, 손권 등 삼국지의 영웅들 심층 분석</div>
      </div>
      <div class="preview-item">
        <span class="preview-icon">📚</span>
        <div><b style="color:var(--text);">오늘의 고사성어</b> — 삼국지에서 유래한 사자성어의 뜻과 유래</div>
      </div>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-dim);margin-top:20px;">
      무료 · 언제든 구독 취소 가능 ·
      <a href="https://mimthedust.github.io/threekingdoms" style="color:var(--gold-muted);">웹사이트 바로가기</a>
    </p>
  </main>

  <script src="/js/subscribe.js"></script>
</body>
</html>
