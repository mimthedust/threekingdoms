<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 삼국지 — 관리자</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="badge">Admin Dashboard</div>
    <h1>📜 데일리 삼국지 관리</h1>
  </header>

  <!-- 로그인 전 화면 -->
  <div id="loginView" class="page" style="display:none;">
    <div class="card" style="text-align:center;">
      <div style="font-size:40px;margin-bottom:16px;">🔐</div>
      <h2 style="color:var(--gold);font-size:18px;margin-bottom:10px;">관리자 로그인</h2>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;line-height:1.7;">
        GitHub 계정으로 로그인하세요.<br>등록된 관리자만 접근 가능합니다.
      </p>
      <a href="/api/auth/login" class="btn btn-github">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub으로 로그인
      </a>
    </div>
  </div>

  <!-- 관리자 대시보드 -->
  <div id="adminView" class="page wide" style="display:none;">
    <!-- 상단 액션 바 -->
    <div class="header-actions">
      <div style="font-size:13px;color:var(--text-dim);">
        <span id="adminUser"></span>으로 로그인 중
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="sendDaily()" id="sendBtn">
          📨 오늘의 이메일 발송
        </button>
        <a href="/api/auth/logout" class="btn btn-secondary">로그아웃</a>
      </div>
    </div>

    <div id="sendMsg" class="msg"></div>

    <!-- 통계 -->
    <div class="stat-row">
      <div class="stat-box">
        <div class="num" id="totalCount">—</div>
        <div class="label">전체 구독자</div>
      </div>
      <div class="stat-box">
        <div class="num" id="referralTotal">—</div>
        <div class="label">초대로 가입</div>
      </div>
      <div class="stat-box">
        <div class="num" id="todayCount">—</div>
        <div class="label">오늘 가입</div>
      </div>
    </div>

    <!-- 구독자 추가 -->
    <div class="card">
      <div class="section-title">구독자 직접 추가</div>
      <form id="addForm" style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="email" id="addEmail" placeholder="추가할 이메일 주소" style="flex:1;min-width:200px;">
        <button type="submit" class="btn btn-secondary">+ 추가</button>
      </form>
      <div id="addMsg" class="msg"></div>
    </div>

    <!-- 구독자 목록 -->
    <div class="card">
      <div class="header-actions" style="margin-bottom:14px;">
        <div class="section-title" style="margin:0;border:none;padding:0;">구독자 목록</div>
        <button class="btn btn-secondary" onclick="loadSubscribers()" style="padding:6px 14px;font-size:12px;">새로고침</button>
      </div>

      <div id="tableLoading" style="text-align:center;padding:30px;color:var(--text-dim);">
        <div class="spinner" style="margin:0 auto 10px;"></div>
        <div>불러오는 중…</div>
      </div>

      <div id="tableWrap" class="table-wrap" style="display:none;">
        <table id="subscriberTable">
          <thead>
            <tr>
              <th>이메일</th>
              <th>가입일</th>
              <th>초대한 사람</th>
              <th style="text-align:center;">초대한 수</th>
              <th>초대 링크</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="subscriberBody"></tbody>
        </table>
        <div id="emptyState" class="empty" style="display:none;">
          아직 구독자가 없습니다.
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
