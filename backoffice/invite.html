<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 삼국지 — 친구 초대</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="badge">Daily Sangukji</div>
    <h1>📜 데일리 삼국지</h1>
    <p class="tagline" id="inviteTagline">친구의 초대로 오셨군요!</p>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-title">초대 구독 신청</div>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:20px;line-height:1.7;">
        매일 아침 7시, 삼국지의 에피소드·인물·고사성어를 이메일로 받아보세요.
        완전 무료이며 언제든지 구독을 취소할 수 있습니다.
      </p>
      <form id="subscribeForm">
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <input type="hidden" id="refCode" name="ref" value="">
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">✉️ 구독하기</span>
          <span id="btnSpinner" class="spinner" style="display:none;"></span>
        </button>
      </form>
      <div id="msg" class="msg"></div>
      <div id="inviteBox" class="invite-box" style="display:none;">
        <div class="invite-label">🎎 이제 당신도 친구를 초대할 수 있어요</div>
        <div class="invite-url" id="inviteUrl"></div>
        <button class="copy-btn" onclick="copyInvite()">초대 링크 복사</button>
      </div>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-dim);margin-top:16px;">
      <a href="/" style="color:var(--gold-muted);">메인 페이지로</a> ·
      <a href="https://mimthedust.github.io/threekingdoms" style="color:var(--gold-muted);">웹사이트 바로가기</a>
    </p>
  </main>

  <script src="/js/invite.js"></script>
</body>
</html>
